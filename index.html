<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: logo di atas, hero putih dengan dua figur K3 di kanan, lalu pencarian, filter jenis link, dan grid kartu. Satu tampilan terang mengikuti warna logo (cokelat tua dan emas). */
:root {
  --bg: #f8f6f1;
  --surface: #ffffff;
  --fg: #3a2412;
  --brown: #53341a;
  --muted: #7d6c5b;
  --line: #e8e1d3;
  --gold: #c09c58;
  --gold-deep: #937220;
  --gold-soft: #f6eedb;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 15px; line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.brand img { display: block; height: 46px; width: auto; max-width: 100%; }

.hero {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  display: flex; gap: 8px 24px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
  padding: 28px 28px 0; overflow: hidden; border-bottom: 3px solid var(--gold);
}
.hero-text { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding-bottom: 28px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-deep); }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
  font-size: clamp(32px, 6vw, 46px); line-height: 1.02; letter-spacing: .01em; color: var(--brown); text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); max-width: 46ch; }
.people { position: relative; flex: 0 1 520px; width: 520px; max-width: 100%; height: 280px; margin-inline: auto; }
.people canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.people img { position: absolute; bottom: 0; display: block; width: auto; }
.people .w1 { right: 108px; height: 196px; }
.people .w2 { right: 0; height: 176px; }

.bar { display: flex; gap: 12px 16px; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 260px; min-width: 0; }
.search input {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
}
.search input::placeholder { color: var(--muted); }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.fbtn {
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--brown);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
}
.fbtn[aria-pressed="true"] { background: var(--brown); border-color: var(--brown); color: #fff; }
.fbtn span { font-family: var(--font-mono); font-weight: 400; margin-left: 4px; opacity: .75; }

:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 2px; }

.notice { background: var(--gold-soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; color: var(--brown); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card {
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px; color: inherit; text-decoration: none;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--gold); transform: translateY(-1px); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.chip {
  font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px;
  background: var(--gold-soft); color: var(--gold-deep);
}
.chip[data-k="Spreadsheet"] { background: #e6f3ec; color: #266a43; }
.chip[data-k="Dokumen"] { background: #e8f0fb; color: #2a5599; }
.chip[data-k="Presentasi"] { background: #fbeee0; color: #a2561a; }
.chip[data-k="Formulir"] { background: #efe9f8; color: #5e3f96; }
.chip[data-k="Video"] { background: #fbe9e7; color: #a5322a; }
.card.off { opacity: .65; cursor: default; }
.card.off:hover { border-color: var(--line); transform: none; }
.chip[data-k="Kosong"] { background: #f3ece0; color: #8a5a1a; }
.num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.name { font-weight: 600; font-size: 17px; line-height: 1.3; color: var(--brown); overflow-wrap: anywhere; }
.host { font-family: var(--font-mono); font-size: 12px; color: var(--gold-deep); overflow-wrap: anywhere; }
.desc { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 1px dashed var(--line); border-radius: 12px; }

details { border-top: 1px solid var(--line); padding-top: 18px; }
summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--brown); }
.panel { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.panel p { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
textarea {
  width: 100%; min-height: 130px; resize: vertical; font-family: var(--font-mono); font-size: 13px;
  color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none;
  border-radius: 9px; padding: 9px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--brown);
}
.btn.primary { background: var(--brown); border-color: var(--brown); color: #fff; }
.msg { font-size: 13px; color: var(--muted); min-height: 1.2em; }
@media (max-width: 560px) {
  .hero { padding: 22px 18px 0; }
  .people { height: 215px; }
  .people .w1 { right: 84px; height: 142px; }
  .people .w2 { right: 0; height: 128px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
.foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.foot span { flex: 1 1 200px; font-size: 13px; color: var(--muted); }
body { margin: 0; }
</style>
</head>

<script>
(function () {
  // Ganti kalau sheet pindah. Sheet harus dibagikan sebagai "Siapa saja yang memiliki link: Pelihat".
  var SHEET_ID = "1GUNlLHZYIYIMcnXWTexLE_khmJ9tNWiB5l1ue-QqRiA";
  var GID = "0";
  var CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&gid=" + GID;
  var KEY = "akses-cepat-cache";
  var KINDS = ["Spreadsheet", "Dokumen", "Presentasi", "Formulir", "Drive", "Video", "Web"];
  var items = [], active = "Semua", state = "loading";

  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid"), q = $("q"), count = $("count"), empty = $("empty"),
      notice = $("notice"), filters = $("filters"), stamp = $("stamp");

  function parseCSV(text) {
    var rows = [], row = [], cell = "", inQ = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
        else cell += c;
      } else if (c === '"') inQ = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = ""; rows.push(row); row = [];
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.join("").trim() !== ""; });
  }
  function toItems(rows) {
    if (!rows.length) return [];
    var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var ix = { no: head.indexOf("no"), nama: head.indexOf("nama"), link: head.indexOf("link"), ket: head.indexOf("keterangan") };
    if (ix.nama < 0) ix = { no: 0, nama: 1, link: 2, ket: 3 };
    return rows.slice(1).map(function (c, i) {
      var g = function (k) { return ix[k] > -1 && c[ix[k]] ? c[ix[k]].trim() : ""; };
      return { no: g("no") || String(i + 1), nama: g("nama"), link: g("link"), ket: g("ket") };
    }).filter(function (r) { return r.nama; });
  }

  function normUrl(u) {
    u = (u || "").trim();
    var m = u.match(/https?:\/\/[^\s"]+/i);
    if (m) u = m[0];
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch (e) { return ""; }
  }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
  function kindOf(u) {
    if (!u) return "Web";
    var x; try { x = new URL(u); } catch (e) { return "Web"; }
    var h = x.hostname.toLowerCase(), p = x.pathname.toLowerCase();
    if (/(^|\.)docs\.google\.com$/.test(h)) {
      if (p.indexOf("/spreadsheets") === 0) return "Spreadsheet";
      if (p.indexOf("/document") === 0) return "Dokumen";
      if (p.indexOf("/presentation") === 0) return "Presentasi";
      if (p.indexOf("/forms") === 0) return "Formulir";
    }
    if (h === "forms.gle" || /(^|\.)forms\.office\.com$/.test(h)) return "Formulir";
    if (/(^|\.)drive\.google\.com$/.test(h)) return "Drive";
    if (/youtube\.com$|youtu\.be$/.test(h)) return "Video";
    if (/\.(xlsx?|csv)$/.test(p)) return "Spreadsheet";
    if (/\.(docx?|pdf)$/.test(p)) return "Dokumen";
    if (/\.pptx?$/.test(p)) return "Presentasi";
    return "Web";
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderFilters(all) {
    var counts = {};
    all.forEach(function (r) { counts[r.kind] = (counts[r.kind] || 0) + 1; });
    if (active !== "Semua" && !counts[active]) active = "Semua";
    filters.textContent = "";
    var names = ["Semua"].concat(KINDS.filter(function (k) { return counts[k]; }));
    names.forEach(function (n) {
      var b = el("button", "fbtn", n);
      b.type = "button";
      b.setAttribute("aria-pressed", String(n === active));
      b.appendChild(el("span", "", String(n === "Semua" ? all.length : counts[n])));
      b.addEventListener("click", function () { active = n; render(); });
      filters.appendChild(b);
    });
    filters.hidden = names.length < 3;
  }

  function render() {
    var all = items.map(function (it) { var h = normUrl(it.link); return { it: it, href: h, kind: kindOf(h) }; });
    renderFilters(all);
    var term = q.value.trim().toLowerCase();
    var list = all.filter(function (r) {
      if (active !== "Semua" && r.kind !== active) return false;
      return !term || (r.it.nama + " " + r.it.ket + " " + hostOf(r.href)).toLowerCase().indexOf(term) > -1;
    });
    grid.textContent = "";
    list.forEach(function (r) {
      var a = el(r.href ? "a" : "div", r.href ? "card" : "card off");
      if (r.href) { a.href = r.href; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      var top = el("div", "top");
      var chip = el("span", "chip", r.href ? r.kind : "Link belum diisi"); chip.setAttribute("data-k", r.href ? r.kind : "Kosong");
      top.appendChild(chip);
      if (r.it.no) top.appendChild(el("span", "num", r.it.no));
      a.appendChild(top);
      a.appendChild(el("span", "name", r.it.nama));
      if (r.href) a.appendChild(el("span", "host", hostOf(r.href)));
      if (r.it.ket) a.appendChild(el("span", "desc", r.it.ket));
      grid.appendChild(a);
    });
    if (state === "loading" && !items.length) { empty.textContent = "Memuat daftar link..."; empty.hidden = false; }
    else if (!items.length) { empty.textContent = "Belum ada link. Isi baris di sheet, lalu klik Muat ulang."; empty.hidden = false; }
    else if (!list.length) { empty.textContent = "Tidak ada link yang cocok."; empty.hidden = false; }
    else empty.hidden = true;
    count.textContent = items.length ? list.length + " dari " + items.length + " link" : "";
  }

  function load() {
    state = "loading"; notice.hidden = true; stamp.textContent = "Memuat dari sheet...";
    fetch(CSV_URL, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (txt) {
        if (/^\s*<(!doctype|html)/i.test(txt)) throw new Error("Sheet belum dibagikan");
        items = toItems(parseCSV(txt)); state = "ok";
        try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
        stamp.textContent = "Diperbarui " + new Date().toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
        render();
      })
      .catch(function () {
        state = "error";
        notice.textContent = "Sheet tidak bisa dimuat. Pastikan sheet dibagikan sebagai \"Siapa saja yang memiliki link\" (Pelihat).";
        notice.hidden = false;
        stamp.textContent = items.length ? "Menampilkan data tersimpan terakhir." : "";
        render();
      });
  }

  try { var cached = JSON.parse(localStorage.getItem(KEY) || "null"); if (cached && cached.length) items = cached; } catch (e) {}
  q.addEventListener("input", render);
  $("reload").addEventListener("click", load);
  render(); load();
})();
</script>
<script>
(function () {
  var cv = document.getElementById("mine");
  if (!cv || !cv.getContext) return;

  var TAU = Math.PI * 2, E = 0.70, SE = Math.sin(E), CE = Math.cos(E);
  var O = [132, 100, 87, 75, 63, 52, 42, 32], PL = O[0], STEP = 7, N = 64, TH = 12, PERIOD = 38, NT = 3;

  function nz(th, k) {

  var RX = [], RZ = [], BS = [], AX = [], j, i;

    BS.push(new Float32Array(N + 1)); AX.push(new Float32Array(N + 1));

      var th0 = i / N * TAU, r0 = ringR(j, th0);

  }

  var cphi = 1, sphi = 0, s = 1, cx = 0, cy = 0, h = 0, PX = 0, PY = 0, PZ = 0, cw = 0, ch = 0, dpr = 1;
  function pr(x, y, z) {

  }
  function c255(v) { return v < 0 ? 0 : v > 255 ? 255 : v | 0; }
  function rgb(r, g, b) { return "rgb(" + c255(r) + "," + c255(g) + "," + c255(b) + ")"; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function shade(nx, nzv) { var b = 0.5 + 0.55 * (-0.6 * nx + 0.55 * nzv); return b < 0 ? 0 : b > 1 ? 1 : b; }

  /* ---------- boxes ---------- */
  var BXs = new Float32Array(8), BYs = new Float32Array(8), BZs = new Float32Array(8);
  var FACE = [[4, 5, 7, 6, 1, 0], [0, 1, 3, 2, -1, 0], [2, 3, 7, 6, 0, 1], [0, 1, 5, 4, 0, -1]];
  var TOPF = [1, 3, 7, 5], fd = [0, 0, 0, 0], fo = [0, 1, 2, 3];

  function box(x, y, z, L, Wd, Ht, hd, col) {

    for (a = 0; a < 2; a++) for (b = 0; b < 2; b++) for (t = 0; t < 2; t++) {

    }

    for (n = 0; n < 4; n++) {

      var nzw = fc[4] === 1 ? fz : fc[4] === -1 ? -fz : fc[5] === 1 ? sz : -sz;

  /* ---------- cones (ore piles) ---------- */
  var CXs = new Float32Array(12), CYs = new Float32Array(12);
  function cone(x, y, z, rad, ht, col) {

    for (q = 0; q < n; q++) {
      var a = q / n * TAU; pr(x + rad * Math.cos(a), y, z + rad * Math.sin(a));
      CXs[q] = PX; CYs[q] = PY;
      if (PX < mn) { mn = PX; mi = q; } if (PX > mx) { mx = PX; ma = q; }
    }
    ctx.beginPath();
    for (q = 0; q < n; q++) { if (q) ctx.lineTo(CXs[q], CYs[q]); else ctx.moveTo(CXs[q], CYs[q]); }
    ctx.closePath(); ctx.fillStyle = rgb(col[0] * 0.8, col[1] * 0.8, col[2] * 0.8); ctx.fill();
    pr(x, y + ht, z);
    ctx.beginPath(); ctx.moveTo(CXs[mi], CYs[mi]); ctx.lineTo(PX, PY); ctx.lineTo(CXs[ma], CYs[ma]); ctx.closePath();
    ctx.fillStyle = rgb(col[0], col[1], col[2]); ctx.fill();
    ctx.beginPath(); ctx.moveTo(CXs[mi], CYs[mi]); ctx.lineTo(PX, PY); ctx.lineTo((CXs[mi] + CXs[ma]) / 2, (CYs[mi] + CYs[ma]) / 2 + rad * s * 0.3); ctx.closePath();
    ctx.fillStyle = rgb(col[0] * 1.15, col[1] * 1.15, col[2] * 1.12); ctx.fill();
  }
  var PILES = [[2.2, 125, 6, 6, [122, 86, 44]], [2.7, 125, 5, 5, [226, 180, 68]], [4.1, 125, 6.5, 7, [118, 84, 42]], [5.25, 125, 5, 4.5, [226, 180, 68]]];
  var pileZ = [0, 0, 0, 0], pileOrd = [0, 1, 2, 3];

  /* ---------- dust ---------- */
  var DM = 56, DX = new Float32Array(DM), DY = new Float32Array(DM), DZ = new Float32Array(DM), DB = new Float32Array(DM);
  var DK = new Int8Array(DM), DP = new Int8Array(DM), DA = new Uint8Array(DM), dnext = 0, lastSp = [0, 0, 0];
  function spawn(x, y, z, k, ph, T) {
    var q = dnext; dnext = (dnext + 1) % DM;

    DB[q] = T; DK[q] = k; DP[q] = ph; DA[q] = 1;
  }
  function drawDust(k, ph, T) {
    for (var q = 0; q < DM; q++) {

      var age = (T - DB[q]) / 1.2;

      if (age < 0) continue;
      pr(DX[q], DY[q] + 0.8 + age * 3, DZ[q]);
      ctx.fillStyle = "rgba(226,203,156," + ((1 - age) * 0.32).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(PX, PY, (1.1 + age * 3.4) * s * 0.55, 0, TAU); ctx.fill();
    }
  }

  /* ---------- road + trucks ---------- */
  var TU = [0, 0, 0], TD = [1, 1, 1], TP = [0, 0.34, 0.67], TX = 0, TY = 0, TZ = 0, THd = 0;
  function truckPose(q) {
    var u = TU[q], thr = 0.5 + u * TAU, r = roadR(u, thr);
    TX = r * Math.cos(thr); TZ = r * Math.sin(thr); TY = -u * STEP + 0.3;
    THd = Math.atan2(Math.cos(thr) * TD[q], -Math.sin(thr) * TD[q]);

  function drawRoad(k, f0, f1) {
    var M = 16, m, f, u, thr, r;
    ctx.beginPath();
    for (m = 0; m <= M; m++) {
      f = f0 + (f1 - f0) * m / M; u = k + f; thr = 0.5 + u * TAU; r = roadR(u, thr);
      pr(r * Math.cos(thr), -u * STEP, r * Math.sin(thr));

    ctx.strokeStyle = "#f8f0da"; ctx.lineWidth = 2.8 * s; ctx.stroke();
  }
  var WHEEL = [34, 34, 40];
  function wheels(x, y, z, hd, side) {
    var fx = Math.cos(hd), fz = Math.sin(hd), sx = -fz * side * 2.7, sz = fx * side * 2.7, la;
    for (la = -2.7; la <= 2.8; la += 5.4) box(x + fx * la + sx, y, z + fz * la + sz, 1.9, 1.0, 1.9, hd, WHEEL);
  }
  function drawTruck(q) {

    pr(x, y, z);

    ctx.beginPath(); ctx.ellipse(PX, PY + 0.8 * s, 6.4 * s, 3.4 * s * SE + 1, 0, 0, TAU); ctx.fill();

    var cabFirst = (-fx * sphi + fz * cphi) < 0;

  /* ---------- excavator ---------- */
  var EXA = 1.6, EXR = 13, HD0 = -0.35;

    box(ex, fy + 1.6, ez, 6.2, 6, 2.6, yaw, [214, 224, 48]);
    box(ex + fx * 1.2 - sx * 1.8, fy + 4.2, ez + fz * 1.2 - sz * 1.8, 2.6, 2.6, 2.2, yaw, [38, 50, 100]);
    var d = T * 1.1, al = 0.62 + 0.28 * Math.sin(d), be = -1.15 + 0.55 * Math.sin(d + 1.4);

    pr(bx + fx * p2d, by + p2h, bz + fz * p2d); xs[2] = PX; ys[2] = PY;

  /* ---------- frame ---------- */

    var dth = TH * CE * s;
    for (i2 = 0; i2 < N; i2++) {

      ctx.lineTo(AX[0][i2 + 1], BS[0][i2 + 1] + dth); ctx.lineTo(AX[0][i2], BS[0][i2] + dth);

    g.addColorStop(0, "rgba(255,236,140,0.85)"); g.addColorStop(1, "rgba(255,236,140,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 30 * s, 0, TAU); ctx.fill(); ctx.restore();

        if (wnz < -0.15) continue;
        var wb = shade(wnx, wnz), wc = rgb(lerp(96, 214, wb) * dk, lerp(68, 176, wb) * dk, lerp(28, 100, wb) * dk);
        ctx.beginPath();
        ctx.moveTo(AX[kk][i2], BS[kk][i2] + k * h); ctx.lineTo(AX[kk][i2 + 1], BS[kk][i2 + 1] + k * h);

      ctx.lineJoin = "round";
      ringPath(kk, (k + 0.45) * h); ctx.strokeStyle = "rgba(60,36,12,0.12)"; ctx.lineWidth = 1.4; ctx.stroke();
      ringPath(kk, (k + 1) * h); ctx.strokeStyle = "rgba(58,34,10,0.16)"; ctx.lineWidth = 3.2 * s; ctx.stroke();

      var tt = k / 6;
      ctx.beginPath();
      for (i2 = 0; i2 <= N; i2++) { if (i2) ctx.lineTo(AX[k][i2], BS[k][i2] + k * h); else ctx.moveTo(AX[k][i2], BS[k][i2] + k * h); }
      ctx.closePath();
      for (i2 = N; i2 >= 0; i2--) { if (i2 === N) ctx.moveTo(AX[kk][i2], BS[kk][i2] + k * h); else ctx.lineTo(AX[kk][i2], BS[kk][i2] + k * h); }
      ctx.closePath();

      ctx.strokeStyle = "rgba(83,52,26,0.22)"; ctx.lineWidth = 1; ctx.stroke();
      ringPath(kk, k * h); ctx.strokeStyle = "rgba(255,247,224,0.6)"; ctx.lineWidth = 1.3; ctx.stroke();

      if (k === 0) {

        for (p = 0; p < 4; p++) {
          pr(PILES[p][2] * 0 + PILES[p][1] * Math.cos(PILES[p][0]), 0, PILES[p][1] * Math.sin(PILES[p][0]));
          pileZ[p] = PZ; pileOrd[p] = p;
        }
        for (p = 1; p < 4; p++) { o = pileOrd[p]; t3 = p - 1; while (t3 >= 0 && pileZ[pileOrd[t3]] > pileZ[o]) { pileOrd[t3 + 1] = pileOrd[t3]; t3--; } pileOrd[t3 + 1] = o; }
        for (p = 0; p < 4; p++) {
          var pc = PILES[pileOrd[p]];

        }

      drawRoad(k, 0, 0.5); drawDust(k, 1, T); trucksIn(k, false);
    }

    for (q = 0; q < 10; q++) {
      var life = (T * 0.32 + q * 0.173) % 1, al2 = Math.sin(life * Math.PI);
      if (al2 < 0.05) continue;
      var sa = q * 2.4, sr = 4 + (q * 7) % 15;
      pr(sr * Math.cos(sa), -7 * STEP + 2 + life * 24, sr * Math.sin(sa));
      ctx.fillStyle = "rgba(244,207,94," + (al2 * 0.25).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(PX, PY, 4.2, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(241,190,52," + (al2 * 0.95).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(PX, PY, 1.7, 0, TAU); ctx.fill();
    }
  }

  var running = false, visible = true, last = 0, T = 0;
  function loop(now) {
    if (!running) return;
    var dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;

  if (window.IntersectionObserver) new IntersectionObserver(function (e) { visible = e[0].isIntersecting; if (visible) start(); else stop(); }).observe(cv);

  T = reduce ? 6 : 0; size(); start();
})();
</script>
